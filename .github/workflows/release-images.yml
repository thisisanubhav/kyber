name: Publish release images

on:
  workflow_dispatch:
    inputs:
      registry:
        description: OCI registry hostname
        required: true
        type: string
      namespace:
        description: Registry namespace or project
        required: true
        type: string
      tag:
        description: Immutable release tag, for example v1.0.0
        required: true
        type: string
      api_url:
        description: Public HTTPS API origin compiled into both frontends
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write
  packages: write

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate immutable release inputs
        env:
          REGISTRY: ${{ inputs.registry }}
          NAMESPACE: ${{ inputs.namespace }}
          RELEASE_TAG: ${{ inputs.tag }}
          API_URL: ${{ inputs.api_url }}
        run: |
          set -eu
          test -n "$REGISTRY"
          test -n "$NAMESPACE"
          test -n "$RELEASE_TAG"
          test "$RELEASE_TAG" != latest
          case "$RELEASE_TAG" in *[[:space:]]*|*/*) exit 1;; esac
          case "$API_URL" in https://*) ;; *) exit 1;; esac

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and publish backend
        id: backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ inputs.registry }}/${{ inputs.namespace }}/kyber-backend:${{ inputs.tag }}
          build-args: VCS_REF=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Attest backend image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ inputs.registry }}/${{ inputs.namespace }}/kyber-backend
          subject-digest: ${{ steps.backend.outputs.digest }}
          push-to-registry: true

      - name: Build and publish website
        id: website
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: website/Dockerfile
          push: true
          tags: ${{ inputs.registry }}/${{ inputs.namespace }}/kyber-website:${{ inputs.tag }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VITE_API_URL=${{ inputs.api_url }}
          provenance: mode=max
          sbom: true

      - name: Attest website image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ inputs.registry }}/${{ inputs.namespace }}/kyber-website
          subject-digest: ${{ steps.website.outputs.digest }}
          push-to-registry: true

      - name: Build and publish app
        id: app
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: app/Dockerfile
          push: true
          tags: ${{ inputs.registry }}/${{ inputs.namespace }}/kyber-app:${{ inputs.tag }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VITE_API_URL=${{ inputs.api_url }}
          provenance: mode=max
          sbom: true

      - name: Attest app image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ inputs.registry }}/${{ inputs.namespace }}/kyber-app
          subject-digest: ${{ steps.app.outputs.digest }}
          push-to-registry: true

      - name: Write digest manifest
        env:
          REGISTRY: ${{ inputs.registry }}
          NAMESPACE: ${{ inputs.namespace }}
          RELEASE_TAG: ${{ inputs.tag }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          WEBSITE_DIGEST: ${{ steps.website.outputs.digest }}
          APP_DIGEST: ${{ steps.app.outputs.digest }}
        run: |
          {
            echo "release_tag=$RELEASE_TAG"
            echo "backend=$REGISTRY/$NAMESPACE/kyber-backend@$BACKEND_DIGEST"
            echo "website=$REGISTRY/$NAMESPACE/kyber-website@$WEBSITE_DIGEST"
            echo "app=$REGISTRY/$NAMESPACE/kyber-app@$APP_DIGEST"
          } > image-digests.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kyber-image-digests-${{ inputs.tag }}
          path: image-digests.txt
          if-no-files-found: error
          retention-days: 90
