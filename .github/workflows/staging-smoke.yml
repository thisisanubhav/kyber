name: Staging smoke

on:
  workflow_dispatch:
    inputs:
      website_origin:
        description: Staging website HTTPS origin
        required: true
        type: string
      app_origin:
        description: Staging app HTTPS origin
        required: true
        type: string
      api_origin:
        description: Staging API HTTPS origin
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: >-
          npm run staging:smoke --
          --website "${{ inputs.website_origin }}"
          --app "${{ inputs.app_origin }}"
          --api "${{ inputs.api_origin }}"
