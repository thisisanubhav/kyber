name: Staging smoke

on:
  workflow_dispatch:
    inputs:
      website_origin:
        description: Staging website HTTPS origin
        required: true
        type: string
      app_origin:
        description: Staging app HTTPS origin
        required: true
        type: string
      api_origin:
        description: Staging API HTTPS origin
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: >-
          npm run staging:smoke --
          --website "${{ inputs.website_origin }}"
          --app "${{ inputs.app_origin }}"
          --api "${{ inputs.api_origin }}"
